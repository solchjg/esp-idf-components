<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLE device setup</title>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#57534e; --line:#d6d3d1; --accent:#2563eb; --bad:#b91c1c; --good:#15803d; --field:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --line:#44403c; --accent:#60a5fa; --bad:#f87171; --good:#4ade80; --field:#292524; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p.lead { color:var(--muted); margin:0 0 20px; }
  button { font:inherit; padding:10px 16px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.quiet { background:transparent; color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  #info { color:var(--muted); font-size:.9rem; margin:8px 0 16px; overflow-wrap:anywhere; }
  label { display:block; margin:12px 0 4px; font-weight:600; font-size:.9rem; }
  input { width:100%; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--field); color:var(--fg); }
  .hint { color:var(--muted); font-size:.8rem; }
  #status { margin-top:16px; min-height:1.5em; }
  .bad { color:var(--bad); } .good { color:var(--good); }
  h2 { font-size:1.1rem; margin:28px 0 0; }
  .dates { display:flex; gap:12px; flex-wrap:wrap; } .dates > div { flex:1 1 140px; }
</style>
</head>
<body>
<main>
  <h1>BLE device setup</h1>
  <p class="lead">Set up or change a device's settings over Bluetooth. Use Chrome or Edge (Bluefy on iPhone). When asked, type the 6-digit code the device shows.</p>
  <div class="row">
    <button id="connect">Connect to device</button>
    <button id="done" class="quiet" disabled>Done</button>
  </div>
  <div id="info"></div>
  <form id="form" hidden>
    <div id="fields"></div>
    <div class="row"><button id="save" type="submit">Save settings</button></div>
  </form>
  <section id="hist" hidden>
    <h2>History</h2>
    <p class="hint">Download the device's history as CSV. Leave a date empty for an open end.</p>
    <div class="dates">
      <div><label for="hfrom">From</label><input id="hfrom" type="date"></div>
      <div><label for="hto">To</label><input id="hto" type="date"></div>
    </div>
    <div class="row"><button id="hdl" type="button">Download history</button></div>
  </section>
  <div id="status" role="status"></div>
</main>
<script>
// Protocol (ble_setup.h): every value is a URL-encoded form body. Writes to
// `settings` append; `control` "apply" acts on them; `result` answers "ok" or
// "invalid=<field>". Reads of `settings` come in 512-byte pages chosen with
// `control` "read=<offset>". Secrets are never read: "<name>_set=1" says one is
// stored, and leaving its box empty keeps it.
// History (optional): `info` carries "history=<CSV header>" when the device
// keeps one. "range=<from>,<to>" (YYYY-MM-DD, either empty) sets the filter;
// "hist=<n>" chooses the first line the next `history` read returns, as many
// whole lines as fit in 512 bytes, empty past the last.
const BASE = (x) => `6e0a00${x}-7d3b-4c2a-9f1e-54445333424c`;
const SVC = BASE('01'), INFO = BASE('02'), SETTINGS = BASE('03'), RESULT = BASE('04'), CONTROL = BASE('05'), HISTORY = BASE('06');
const enc = new TextEncoder(), dec = new TextDecoder();
const $ = (id) => document.getElementById(id);
let device, chars = {}, secrets = {}, info = new URLSearchParams();

function status(text, cls = '') { const s = $('status'); s.textContent = text; s.className = cls; }

async function readAll() {
  let out = '', off = 0;
  for (;;) {
    await chars.control.writeValueWithResponse(enc.encode(`read=${off}`));
    const page = dec.decode(await chars.settings.readValue());
    out += page;
    if (enc.encode(page).length < 512) return out;
    off += 512;
  }
}

function render(body) {
  const params = new URLSearchParams(body);
  const box = $('fields');
  box.replaceChildren();
  secrets = {};
  const add = (name, value, secret) => {
    const label = document.createElement('label');
    label.textContent = name;
    label.htmlFor = `f-${name}`;
    const input = document.createElement('input');
    input.id = `f-${name}`; input.name = name; input.value = value;
    input.autocomplete = 'off';
    if (secret) {
      input.type = 'password';
      if (secret === 'stored') input.placeholder = 'stored; leave empty to keep it';
    }
    box.append(label, input);
  };
  // A secret's box goes where its "<name>_set" flag stands in the body.
  for (const [k, v] of params) {
    if (k.endsWith('_set')) {
      const name = k.slice(0, -4);
      secrets[name] = v === '1' ? 'stored' : 'none';
      add(name, '', secrets[name]);
      continue;
    }
    add(k, v, false);
  }
  $('form').hidden = false;
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
// A step that needs no person bounded in time, so a link that went quiet
// fails here instead of leaving the page waiting for ever.
// Generous: a phone may pair as the link comes up, and the person types the
// code meanwhile, holding up these steps (pairing itself times out at 30 s).
const STEP_MS = 45000;
function bounded(p, ms, what) {
  let t;
  return Promise.race([p, new Promise((_, no) => { t = setTimeout(() => no(new Error(`${what}: no answer`)), ms); })])
    .finally(() => clearTimeout(t));
}

function linkDown() {
  $('done').disabled = true; $('save').disabled = true; $('hdl').disabled = true;
  if (!busy && !$('status').className) status('Disconnected.');
}

async function openLink() {
  if (device.gatt.connected) device.gatt.disconnect();  // a link left from before
  const server = await bounded(device.gatt.connect(), STEP_MS, 'connect');
  const svc = await bounded(server.getPrimaryService(SVC), STEP_MS, 'services');
  chars = {};
  for (const [k, u] of Object.entries({ info: INFO, settings: SETTINGS, result: RESULT, control: CONTROL })) {
    chars[k] = await bounded(svc.getCharacteristic(u), STEP_MS, 'services');
  }
  info = new URLSearchParams(dec.decode(await bounded(chars.info.readValue(), STEP_MS, 'info')));
  $('info').textContent = [...info].filter(([k]) => k !== 'history')
    .map(([k, v]) => `${k}: ${v}`).join(' · ');
  if (info.has('history')) chars.history = await bounded(svc.getCharacteristic(HISTORY), STEP_MS, 'services');
  status('Pairing: type the code shown on the device…');
  render(await readAll());  // the first protected read starts pairing
}

let busy = false;
async function connect() {
  status('Choose the device in the list…');
  const picked = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }] });
  if (picked !== device) {
    if (device && device.gatt.connected) device.gatt.disconnect();
    device = picked;
    device.addEventListener('gattserverdisconnected', linkDown);
  }
  busy = true;
  try {
    // A phone that kept a key from an earlier pairing is disconnected by the
    // device, and forgets the key; the second try pairs afresh.
    for (let tries = 1; ; tries++) {
      try {
        status('Connecting…');
        await openLink();
        break;
      } catch (e) {
        if (device.gatt.connected) device.gatt.disconnect();
        if (tries === 2) {
          throw new Error(`${e.message || e}. Try again; if it keeps failing, remove ${device.name} from the phone's Bluetooth devices first.`);
        }
        await sleep(1500);
      }
    }
  } finally {
    busy = false;
  }
  $('done').disabled = false; $('save').disabled = false; $('hdl').disabled = false;
  $('hist').hidden = !chars.history;
  status(`Connected to ${device.name}.`);
}

async function save(ev) {
  ev.preventDefault();
  const params = new URLSearchParams();
  for (const input of $('fields').querySelectorAll('input')) {
    // An empty box for a stored secret keeps it: the field is left out.
    if (secrets[input.name] === 'stored' && input.value === '') continue;
    params.append(input.name, input.value);
  }
  const bytes = enc.encode(params.toString());
  status('Saving…');
  for (let i = 0; i < bytes.length; i += 512) {
    await chars.settings.writeValueWithResponse(bytes.slice(i, i + 512));
  }
  await chars.control.writeValueWithResponse(enc.encode('apply'));
  const result = dec.decode(await chars.result.readValue());
  if (result === 'ok') status('Saved. The device applies the settings now and may restart.', 'good');
  else status(result.startsWith('invalid=') ? `Not saved: check "${result.slice(8)}".` : `Not saved: ${result}`, 'bad');
}

async function downloadHistory() {
  const from = $('hfrom').value, to = $('hto').value;
  if (from && to && from > to) { status('"From" is after "To".', 'bad'); return; }
  $('hdl').disabled = true;
  try {
    await chars.control.writeValueWithResponse(enc.encode(`range=${from},${to}`));
    const parts = [info.get('history') + '\n'];
    let n = 0;
    for (;;) {
      await chars.control.writeValueWithResponse(enc.encode(`hist=${n}`));
      const page = dec.decode(await chars.history.readValue());
      if (!page) break;
      parts.push(page);
      n += page.split('\n').length - 1;  // every line ends with a newline
      status(`Downloading… ${n} readings`);
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(parts, { type: 'text/csv' }));
    a.download = `${info.get('host') || device.name}-history.csv`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    status(`Saved ${n} readings.`, 'good');
  } finally {
    $('hdl').disabled = false;
  }
}

$('connect').addEventListener('click', () => connect().catch((e) => status(String(e.message || e), 'bad')));
$('form').addEventListener('submit', (e) => save(e).catch((x) => status(String(x.message || x), 'bad')));
$('hdl').addEventListener('click', () => downloadHistory().catch((e) => status(String(e.message || e), 'bad')));
$('done').addEventListener('click', () => chars.control.writeValueWithResponse(enc.encode('done'))
  .then(() => status('Finished. The device turns Bluetooth off.', 'good'))
  .catch((e) => status(String(e.message || e), 'bad')));
if (!navigator.bluetooth) status('This browser has no Web Bluetooth. Use Chrome or Edge, or Bluefy on iPhone.', 'bad');
</script>
</body>
</html>
